	const convertSVG = (image) =>
	{
		if (typeof fetch !== "undefined")
		{
			// Get the SVG file from the cache
			fetch(image.src, { cache: "force-cache" })
				.then((res) => res.text())
				.then((data) =>
				{
					// Parse the SVG text and turn it into DOM nodes
					const parser = new DOMParser();
					const svg = parser
						.parseFromString(data, "image/svg+xml")
						.querySelector("svg");
					const parentNode = image.parentNode;

					if (!svg) return;
					// Pass along any class or IDs from the parent <img> element
					if (image.id) svg.id = image.id;
					if (image.className) svg.setAttribute("class", image.className);

					// Replace the parent <img> with our inline SVG
					if (parentNode) parentNode.replaceChild(svg, image);
				})
				.catch((error) => console.error(error));
		}
	};
</script>
