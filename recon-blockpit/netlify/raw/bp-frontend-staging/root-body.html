        height: 100vh;
        width: 100vw;

        color: rgb(14, 30, 37);

        display: block;
        width: 100%;
        height: 40px;
        margin: 24px 0;
        padding: 6px 14px;
        border: 2px solid #e9ebeb;
        border-radius: 4px;
        background: none;
        box-shadow: none;

        font-weight: 500;
        line-height: 24px;
        transition: box-shadow ease-in-out 0.15s;
        -webkit-appearance: none;
        -moz-appearance: none;
      }

      input:focus {
        outline: none;
        border-color: #f4bb00;
        box-shadow: 0 0 1px 0 #f4bb00;
      }

      .button,
      button {
        position: relative;
        box-sizing: border-box;
        display: inline-block;
        vertical-align: middle;
        width: 100%;
        padding: 8px 16px;
        font-family: inherit;
        font-size: 16px;
        font-weight: 500;
        line-height: 24px;
        text-align: center;
        text-decoration: none;
        align-self: center;
        border-radius: 4px;
        background-color: #007067;
        border: none;
        color: #fff;
        box-shadow: none;
        transition: all 0.2s ease;
        transition-property: background-color;
        outline: 0;
      }

      button:hover {
        cursor: pointer;
        box-shadow: 0 0 0 2px #f4bb00;
      }

      .alert-box {
        position: relative;
        display: block;
        margin-bottom: -8px;
        background: #fff4f5;
        border-radius: 4px;
        padding: 4px 8px;
        font-size: 14px;
        color: #ad2831;

        line-height: 24px;
        font-weight: 500;
      }
      body { overflow: visible; }

      .brand {
